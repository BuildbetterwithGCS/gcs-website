<!-- Official GCS Logo — Approved Asset
     Compass mark with dark navy, olive green, slate gray palette
     Wordmark: GCS | Tagline: BUILD BETTER ORGANIZATIONS
     Do NOT alter without Founder approval. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 310" role="img" aria-label="GCS — Build Better Organizations">
  <title>GCS — Build Better Organizations</title>

  <!-- ===== COMPASS MARK (center at 160,112) ===== -->

  <!-- NW arc segment (dark navy) — spans ~200° to 250° -->
  <path d="M 94,86 A 70,70 0 0,1 136,44 L 143,63 A 50,50 0 0,0 113,93 Z" fill="#1a2a4a"/>

  <!-- NE arc segment (medium steel blue) — spans ~290° to 340° -->
  <path d="M 184,44 A 70,70 0 0,1 226,86 L 207,93 A 50,50 0 0,0 177,63 Z" fill="#2e5080"/>

  <!-- SE arc segment (medium steel blue) — spans ~20° to 70° -->
  <path d="M 226,138 A 70,70 0 0,1 184,180 L 177,161 A 50,50 0 0,0 207,131 Z" fill="#2e5080"/>

  <!-- SW arc segment (dark navy) — spans ~110° to 160° -->
  <path d="M 136,180 A 70,70 0 0,1 94,138 L 113,131 A 50,50 0 0,0 143,161 Z" fill="#1a2a4a"/>

  <!-- North diamond (olive/lime green) -->
  <polygon points="160,20 173,60 160,72 147,60" fill="#78b829"/>

  <!-- South diamond (slate gray) -->
  <polygon points="160,204 173,164 160,152 147,164" fill="#6b7a87"/>

  <!-- West arrow (dark navy) -->
  <polygon points="76,112 116,97 116,127" fill="#1a2a4a"/>

  <!-- East arrow (medium steel blue) -->
  <polygon points="244,112 204,97 204,127" fill="#2e5080"/>

  <!-- Center circle (olive green) -->
  <circle cx="160" cy="112" r="26" fill="#5a8a2a"/>

  <!-- ===== GCS WORDMARK ===== -->
  <text
    x="160" y="236"
    text-anchor="middle"
    font-family="'Arial Black', 'Franklin Gothic Heavy', 'Impact', system-ui, sans-serif"
    font-size="76"
    font-weight="900"
    letter-spacing="6"
    fill="#0f1f3d">GCS</text>

  <!-- ===== TAGLINE ===== -->
  <!-- "BUILD BETTER " in dark navy -->
  <text
    x="62" y="275"
    font-family="'Arial', 'Helvetica Neue', system-ui, sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="2.5"
    fill="#0f1f3d">BUILD BETTER </text>
  <!-- "ORGANIZATIONS" in olive green -->
  <text
    x="188" y="275"
    font-family="'Arial', 'Helvetica Neue', system-ui, sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="2.5"
    fill="#78b829">ORGANIZATIONS</text>
</svg>
