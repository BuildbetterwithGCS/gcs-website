<!-- Official GCS Logo — Approved Asset
     Compass mark with dark navy, olive green, slate gray palette
     Wordmark: GCS | Tagline: BUILD BETTER ORGANIZATIONS
     Do NOT alter without Founder approval. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="GCS — Build Better Organizations">
  <title>GCS — Build Better Organizations</title>

  <!-- ===== COMPASS MARK ===== -->
  <!-- Center circle (olive green) -->
  <circle cx="160" cy="110" r="22" fill="#5a7a2e"/>

  <!-- Top diamond (olive green) -->
  <polygon points="160,55 172,85 160,88 148,85" fill="#7aaa35"/>

  <!-- Bottom diamond (slate gray) -->
  <polygon points="160,165 172,135 160,132 148,135" fill="#6b7a87"/>

  <!-- Left arc segment (dark navy) -->
  <path d="M 88,110 A 72,72 0 0,1 115,58 L 122,73 A 54,54 0 0,0 106,110 Z" fill="#1a2a4a"/>

  <!-- Right arc segment (dark navy/steel blue) -->
  <path d="M 232,110 A 72,72 0 0,0 205,58 L 198,73 A 54,54 0 0,1 214,110 Z" fill="#2e4a7a"/>

  <!-- Left arrow point (dark navy) -->
  <polygon points="88,110 115,98 115,122" fill="#1a2a4a"/>

  <!-- Right arrow point (steel blue) -->
  <polygon points="232,110 205,98 205,122" fill="#2e4a7a"/>

  <!-- Left arc lower (dark navy) -->
  <path d="M 88,110 A 72,72 0 0,0 115,162 L 122,147 A 54,54 0 0,1 106,110 Z" fill="#1a2a4a"/>

  <!-- Right arc lower (steel blue) -->
  <path d="M 232,110 A 72,72 0 0,1 205,162 L 198,147 A 54,54 0 0,0 214,110 Z" fill="#2e4a7a"/>

  <!-- ===== GCS WORDMARK ===== -->
  <text
    x="160" y="225"
    text-anchor="middle"
    font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, system-ui, sans-serif"
    font-size="72"
    font-weight="900"
    letter-spacing="4"
    fill="#0f1f3d">GCS</text>

  <!-- ===== TAGLINE ===== -->
  <!-- "BUILD BETTER " in dark navy -->
  <text
    x="68" y="263"
    font-family="'Arial', system-ui, sans-serif"
    font-size="17"
    font-weight="700"
    letter-spacing="2.5"
    fill="#0f1f3d">BUILD BETTER </text>
  <!-- "ORGANIZATIONS" in olive green -->
  <text
    x="191" y="263"
    font-family="'Arial', system-ui, sans-serif"
    font-size="17"
    font-weight="700"
    letter-spacing="2.5"
    fill="#7aaa35">ORGANIZATIONS</text>
</svg>
